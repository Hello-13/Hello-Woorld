<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Widget</title>
<style>
  /* A slim strip above the page: drag it to move the widget, buttons on the right. Colors follow the dashboard. */
  :root {
    --bar: #E3E7EF;
    --line: rgba(17, 24, 39, .12);
    --ink: #111827;
    --ink-2: #465068;
    --hover: rgba(17, 24, 39, .08);
    --accent: #3F51B5;
    --accent-ink: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bar: #0A0F1A;
      --line: rgba(231, 235, 244, .12);
      --ink: #E7EBF4;
      --ink-2: #A6B0C5;
      --hover: rgba(231, 235, 244, .1);
      --accent: #98A6FF;
      --accent-ink: #0A0F1A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bar); }
  body { font: 600 12.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }
  .bar {
    position: relative; height: 34px; display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 8px; border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
  }
  .grip { width: 14px; height: 14px; color: var(--ink-2); opacity: .7; flex: none; }
  #title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
  .group { display: flex; align-items: center; gap: 1px; -webkit-app-region: no-drag; }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; flex: none; }
  button {
    -webkit-app-region: no-drag; display: inline-grid; place-items: center;
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px;
    background: none; color: var(--ink-2); cursor: pointer; font: inherit;
  }
  button:hover { background: var(--hover); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button svg { width: 15px; height: 15px; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  #zoom { width: auto; min-width: 40px; padding: 0 4px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  .bar.loading .progress { opacity: 1; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; left: 0; width: 100%; opacity: .5; } }
  @media (max-width: 360px) { .wide { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <svg class="grip" viewBox="0 0 14 14" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="3" r="1.3"/><circle cx="10" cy="3" r="1.3"/><circle cx="4" cy="7" r="1.3"/><circle cx="10" cy="7" r="1.3"/><circle cx="4" cy="11" r="1.3"/><circle cx="10" cy="11" r="1.3"/></g></svg>
    <span id="title">Widget</span>
    <div class="group">
      <button type="button" data-act="home" id="home" title="Back to this widget's page" aria-label="Back to this widget's page" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3v-3.5h2V13h3V6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
      <button type="button" data-act="reload" title="Reload (Ctrl/Cmd+R)" aria-label="Reload">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <span class="sep wide"></span>
    <div class="group wide">
      <button type="button" data-act="zoom-out" title="Zoom out (Ctrl/Cmd −)" aria-label="Zoom out">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="button" data-act="zoom-reset" id="zoom" title="Reset zoom (Ctrl/Cmd 0)" aria-label="Reset zoom">80%</button>
      <button type="button" data-act="zoom-in" title="Zoom in (Ctrl/Cmd +)" aria-label="Zoom in">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button type="button" data-act="pin" aria-pressed="false" title="Float above other windows" aria-label="Float above other windows">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 2.2 13.8 6.4 11.9 7.1 9.6 9.4 9.9 12.3 8.9 13.3 6.3 10.7 3 14l-1-1 3.3-3.3L2.7 7.1l1-1 2.9.3 2.3-2.3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-act="browser" class="wide" title="Open in your browser" aria-label="Open in your browser">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3 7.5 8.5M11.5 9.5V13H3V4.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-act="hide" title="Hide. Bring it back from the Study Widgets icon in your menu bar or tray." aria-label="Hide this widget">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
