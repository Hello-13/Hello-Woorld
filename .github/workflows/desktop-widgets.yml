name: Study Widgets app

# Builds the desktop widget app for macOS, Windows and Linux.
# Download an installer from a run's "Artifacts" section.
on:
  push:
    paths:
      - 'desktop-widgets/**'
      - '.github/workflows/desktop-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
            files: desktop-widgets/dist/*.dmg
          - name: Windows
            os: windows-latest
            target: --win
            files: desktop-widgets/dist/*.exe
          - name: Linux
            os: ubuntu-latest
            target: --linux
            files: desktop-widgets/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-widgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-widgets/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Launch test
        if: runner.os == 'Linux'
        run: npm run smoke
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch test of the packaged app
        if: runner.os == 'Linux'
        run: npm run smoke
        env:
          SMOKE_APP: ${{ github.workspace }}/desktop-widgets/dist/linux-unpacked/study-widgets
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Widgets-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
